# The Open Meridian plugin on this fork, job by job:
# - checks: what we add held to its rules (upstream changes listed, names,
#   licences, no route out), `meridian plugin check` with the plugin's tests;
# - browser: the front end built as the image builds it, the licence scan of
#   what it ships, and Workspace's own UI at 375, 582 and 1280 wide against a
#   stand-in sidecar, its requests recorded;
# - deployment: a deployment from the released CLI and chart on k3d, with two
#   dashboard copies and the platform-master stand-in; plugin-ecb and this
#   plugin uploaded and launched; then the e2e in a headless browser.
name: open-meridian

on:
  pull_request:
    branches: [open-meridian]
  push:
    branches: [open-meridian]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: open-meridian-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "26.12.1"
  PYTHON_VERSION: "3.12"
  PLAYWRIGHT_VERSION: "1.65.2"
  # The released CLI and the chart its documentation describes (as
  # open-meridian/opencode#1 and meridian-desktop pin them).
  MERIDIAN_CLI_VERSION: v0.1.61
  MERIDIAN_CLI_SHA256: 1e51085c2dd8e5a418ecc936a5ace7bbd10db2e06d7c72176c0edde4b24abdfa
  CHART_VERSION: 0.1.632
  K3S_IMAGE: rancher/k3s:v1.36.5-k3s1
  K3D_VERSION: v5.9.0
  K3D_SHA256: 06d8f25bc3a971c4eb29e0ff08429b180402db0f4dec838c9eac427e296800a0
  HELM_VERSION: v3.19.0
  HELM_SHA256: a7f81ce08007091b86d8bd696eb4d86b8d0f2e1b9f6c714be62f82f96a594496
  # The platform-master stand-in: core's published harness, as plugin-ecb's e2e pins it.
  HARNESS_IMAGE: ghcr.io/open-meridian/meridian-harness:aae501d@sha256:7e4fb2237c5fb579f9302a14d569c3c85dd6ba2c69e5219abdfe33231bed8305
  # plugin-ecb (public, keyless) at the commit that pins SDK 0.37.1.
  ECB_REPO: https://github.com/open-meridian/plugin-ecb.git
  ECB_REV: 81f62f4e7e659f3bafee4fb73ce5f5994f5ebd3d

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - name: The fork's rules
        env:
          BASE_REF: origin/open-meridian
        run: bash open-meridian/ci/checks.sh
      - name: The released CLI, checked against its pinned checksum
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"
          curl -fsSL -o /tmp/meridian \
            "https://github.com/open-meridian/meridian-cli/releases/download/${MERIDIAN_CLI_VERSION}/meridian-x86_64-unknown-linux-musl"
          echo "${MERIDIAN_CLI_SHA256}  /tmp/meridian" | sha256sum -c -
          install -m 0755 /tmp/meridian "$HOME/.local/bin/meridian"
      - name: The plugin, with its tests
        working-directory: open-meridian/plugin
        run: |
          python -m pip install -e . pytest==8.4.2
          meridian plugin check --run-tests

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - name: The front end, as the image builds it, and the licence scan of what it ships
        run: open-meridian/ci/frontend.sh
      - name: A headless browser
        run: |
          python -m pip install -e open-meridian/plugin pytest==8.4.2 "playwright==${PLAYWRIGHT_VERSION}"
          python -m playwright install --with-deps chromium
      - name: Workspace's UI at 375, 582 and 1280 wide, its requests recorded
        working-directory: open-meridian/plugin
        env:
          BROWSER_SHOTS: ${{ runner.temp }}/browser-shots
        run: python -m pytest -q tests/test_browser.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: { name: browser-check, path: "${{ runner.temp }}/browser-shots", if-no-files-found: ignore }

  deployment:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - name: The front end, as the image builds it
        run: open-meridian/ci/frontend.sh
      - name: A headless browser and the first run's hash
        run: |
          python -m pip install "playwright==${PLAYWRIGHT_VERSION}" argon2-cffi==25.1.0
          python -m playwright install --with-deps chromium
      - name: The released CLI, k3d and Helm, each checked against its pinned checksum
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"
          curl -fsSL -o /tmp/meridian \
            "https://github.com/open-meridian/meridian-cli/releases/download/${MERIDIAN_CLI_VERSION}/meridian-x86_64-unknown-linux-musl"
          echo "${MERIDIAN_CLI_SHA256}  /tmp/meridian" | sha256sum -c -
          install -m 0755 /tmp/meridian "$HOME/.local/bin/meridian"
          curl -fsSL -o /tmp/k3d "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/k3d-linux-amd64"
          echo "${K3D_SHA256}  /tmp/k3d" | sha256sum -c -
          install -m 0755 /tmp/k3d "$HOME/.local/bin/k3d"
          curl -fsSL -o /tmp/helm.tgz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  /tmp/helm.tgz" | sha256sum -c -
          tar -xzf /tmp/helm.tgz -C /tmp linux-amd64/helm
          install -m 0755 /tmp/linux-amd64/helm "$HOME/.local/bin/helm"
          "$HOME/.local/bin/meridian" --version
      - name: A run directory only this job reads
        run: |
          run_dir="$RUNNER_TEMP/workspace"
          mkdir -p "$run_dir/config" && chmod 700 "$run_dir"
          { echo "RUN_DIR=$run_dir"; echo "KUBECONFIG=$run_dir/kubeconfig"; echo "XDG_CONFIG_HOME=$run_dir/config"; } >>"$GITHUB_ENV"
      - name: The platform-master stand-in
        run: open-meridian/ci/platform.sh
      - name: A deployment, from the released chart, with two dashboard copies
        run: open-meridian/ci/deployment.sh
      - name: First run, and two people
        run: python open-meridian/ci/first_run.py "$RUN_DIR"
      - name: plugin-ecb and the workspace, uploaded and launched by the released CLI
        run: open-meridian/ci/plugins.sh
      - name: The workspace, through the dashboard
        run: python open-meridian/ci/e2e.py "$RUN_DIR"
      - name: What the deployment said
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/kept"
          kubectl get pods -A -o wide >"$RUNNER_TEMP/kept/pods.txt" 2>&1 || true
          kubectl -n meridian get events --sort-by=.lastTimestamp >"$RUNNER_TEMP/kept/events.txt" 2>&1 || true
          for c in dashboard launcher conductor instrument plugin-ecb plugin-workspace; do
            kubectl -n meridian logs "deploy/meridian-meridian-runtime-$c" --all-containers --tail=400 >"$RUNNER_TEMP/kept/$c.log" 2>&1 || true
          done
          # Each dashboard copy's own log: a request is answered by either.
          for pod in $(kubectl -n meridian get pods -o name | grep -- '-dashboard-' | grep -v -- '-key-'); do
            kubectl -n meridian logs "$pod" --all-containers --tail=600 >"$RUNNER_TEMP/kept/${pod##*/}.log" 2>&1 || true
          done
          # Never person.json, person2.json, the kubeconfig or the CLI's sessions.
          cp "$RUN_DIR/meridian-up.log" "$RUN_DIR/platform.log" "$RUNNER_TEMP/kept/" 2>/dev/null || true
          cp -R "$RUN_DIR/shots" "$RUNNER_TEMP/kept/" 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: { name: deployment, path: "${{ runner.temp }}/kept", if-no-files-found: ignore }
